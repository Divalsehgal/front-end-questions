<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      .row { display: flex; flex-wrap: wrap; gap: 24px; padding: 16px; }
      .shape { width: 120px; height: 120px; background: #7b2cbf; transition: transform 0.3s; }
      .shape:hover { transform: rotate(15deg) scale(1.05); } /* GPU-friendly */
      .circle { clip-path: circle(50%); } /* or border-radius: 50% */
      .triangle { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
      .hexagon { clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
      .parallelogram { width: 160px; clip-path: polygon(25% 0, 100% 0, 75% 100%, 0 100%); }
      .star {
        clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      }
      .fade {
        /* mask-image = soft, pixel-based alpha; clip-path = hard vector edge */
        mask-image: linear-gradient(to bottom, black 50%, transparent);
      }
      @media (prefers-reduced-motion: reduce) {
        .shape { transition: none; }
        .shape:hover { transform: none; filter: brightness(1.15); } /* a non-motion hover cue */
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="shape circle"></div>
      <div class="shape triangle"></div>
      <div class="shape hexagon"></div>
      <div class="shape parallelogram"></div>
      <div class="shape star"></div>
      <div class="shape fade"></div>
    </div>
  </body>
</html>
