<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FE Grind — Free frontend interview questions & practice</title>
    <!--app-head-->
    <meta name="theme-color" content="#0d2149" />
    <meta name="author" content="Dival Sehgal" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The one web font (Inter, self-hosted; see src/index.css): fetched early, never blocks first paint. -->
    <link rel="preload" href="/src/assets/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Apply the saved / system theme before first paint, so prerendered pages don't flash light. -->
    <script>
      try {
        var t = localStorage.getItem('grind:theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
