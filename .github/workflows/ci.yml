name: CI

# One pipeline: every push and PR is verified; pushes to main then deploy the exact build that passed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Repository variable (Settings → Secrets and variables → Actions → Variables). Empty falls back to the
      # default in vite.config.ts. Set it when you move to a custom domain.
      SITE_URL: ${{ vars.SITE_URL }}
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar needs full history; the sitemap's <lastmod> comes from git dates

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check (app and tests)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Lint styles (Stylelint)
        run: npm run lint:styles

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: WCAG AA contrast
        run: npm run check:contrast

      # Runs unit tests plus the content gate: every drill's reference solution must pass its
      # tests and type tests, every starter must fail, every output snippet must run.
      - name: Test with coverage
        run: npm run test:coverage

      # Full production build: client, SSR bundle, prerendered pages, sitemap and robots.txt.
      - name: Build and prerender
        run: npm run build

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

      - name: SonarCloud scan
        # Skipped for forks and Dependabot, which don't get repository secrets.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true # keep gh-pages to a single commit instead of growing forever
