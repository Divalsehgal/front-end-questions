name: CI

# Verifies every push and PR. Deploys are handled by Vercel's Git integration (production from main,
# a preview URL for every PR); protect main with this `verify` check so only passing code reaches production.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Empty for forks, Dependabot, and until the secret is added: the Sonar step is then skipped, not failed.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Optional Turborepo remote cache (Vercel): unset, every task simply runs.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Sonar needs full history; the sitemap's <lastmod> comes from git dates

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The app's src/generated/architecture.json is derived from the code: fail if a change forgot to regenerate it.
      - name: Architecture diagram is up to date
        run: npm run architecture:check

      # Turborepo runs each workspace's tasks in dependency order (generate first) and in parallel,
      # and skips any task whose inputs are unchanged when a remote cache is configured (TURBO_TOKEN).
      - name: Type-check, lint, contrast and test with coverage (every workspace)
        run: npx turbo run typecheck lint check:contrast test:coverage

      - name: Lint repo-level config (ESLint)
        run: npm run lint:root

      - name: Lint styles (Stylelint)
        run: npm run lint:styles

      - name: Check formatting (Prettier)
        run: npm run format:check

      # Full production build of apps/web: prerendered pages, sitemap and robots.txt.
      - name: Build and prerender
        run: npx turbo run build

      # Requires SonarCloud's Automatic Analysis to be OFF (the two modes conflict and the scan exits with code 3).
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
