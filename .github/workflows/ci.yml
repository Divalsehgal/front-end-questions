name: CI

# Verifies every push and PR. Deploys are handled by Vercel's Git integration (production from main,
# a preview URL for every PR); protect main with this `verify` check so only passing code reaches production.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Empty for forks, Dependabot, and until the secret is added: the Sonar step is then skipped, not failed.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Sonar needs full history; the sitemap's <lastmod> comes from git dates

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # src/generated/architecture.json is derived from the code: fail if a change forgot to regenerate it.
      - name: Architecture diagram is up to date
        run: npm run architecture:check

      - name: Type-check (app and tests)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Lint styles (Stylelint)
        run: npm run lint:styles

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: WCAG AA contrast
        run: npm run check:contrast

      # Runs unit tests plus the content gate: every drill's reference solution must pass its
      # tests and type tests, every starter must fail, every output snippet must run.
      - name: Test with coverage
        run: npm run test:coverage

      # Full production build: client, SSR bundle, prerendered pages, sitemap and robots.txt.
      - name: Build and prerender
        run: npm run build

      # Requires SonarCloud's Automatic Analysis to be OFF (the two modes conflict and the scan exits with code 3).
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
