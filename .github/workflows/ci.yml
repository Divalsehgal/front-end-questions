name: CI

# Verifies every push and PR. Deploys are handled by Vercel's Git integration (production from main,
# a preview URL for every PR); protect main with this `verify` check so only passing code reaches production.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar needs full history; the sitemap's <lastmod> comes from git dates

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check (app and tests)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Lint styles (Stylelint)
        run: npm run lint:styles

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: WCAG AA contrast
        run: npm run check:contrast

      # Runs unit tests plus the content gate: every drill's reference solution must pass its
      # tests and type tests, every starter must fail, every output snippet must run.
      - name: Test with coverage
        run: npm run test:coverage

      # Full production build: client, SSR bundle, prerendered pages, sitemap and robots.txt.
      - name: Build and prerender
        run: npm run build

      - name: SonarCloud scan
        # Skipped for forks and Dependabot, which don't get repository secrets.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
