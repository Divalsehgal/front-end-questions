name: Deploy Master Web Index

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'html/web/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ./html/web
        run: npm install

      - name: Build Vite App
        working-directory: ./html/web
        run: npm run build

      - name: Deploy Built Dist to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./html/web/dist
          publish_branch: gh-pages
