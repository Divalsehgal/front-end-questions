# SonarCloud Automatic Analysis settings. Automatic Analysis ignores sonar-project.properties and
# reads only this file. CI-based analysis (.github/workflows/ci.yml + sonar-project.properties) is
# preferred: it also uploads test coverage. Turn Automatic Analysis OFF in SonarCloud
# (Administration → Analysis Method) once SONAR_TOKEN is set; until then, this keeps it in line.
# Keep sources, tests and exclusions identical to sonar-project.properties.
sonar.sources=src,scripts,vite-plugins
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,src/content/subjects/**/files/**
sonar.cpd.exclusions=src/content/subjects/**
