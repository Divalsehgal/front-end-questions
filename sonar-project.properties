# SonarCloud (CI-based analysis, .github/workflows/ci.yml). Create the project by importing
# Divalsehgal/front-end-questions in SonarCloud, turn OFF Automatic Analysis
# (Administration → Analysis Method), and add a SONAR_TOKEN repo secret.
# Automatic Analysis ignores this file and reads .sonarcloud.properties instead: keep the two in sync.
sonar.organization=divalsehgal
sonar.projectKey=Divalsehgal_front-end-questions
sonar.projectName=FE Grind

# App code plus the Node build scripts that ship it.
sonar.sources=apps/web/src,apps/web/scripts,packages,scripts
sonar.tests=apps/web/src,packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,apps/web/src/test/**,packages/ui/src/test/**,packages/runtime/src/node/**
# Tests are analysed as tests, not sources. Question fixtures (starters, solutions, test files and
# HTML documents under any subject's files/ folder) are content shown verbatim to learners; some
# deliberately contain the bug a question asks to fix, and packages/content/src/content.test.ts checks them.
# The DSA reference solutions (packages/dsa/scripts/traces/solutions.mjs) are lesson code too: they show the
# textbook idioms on purpose (prototype polyfills, sequential awaits), and npm run dsa:traces checks every output.
sonar.exclusions=**/*.test.ts,**/*.test.tsx,apps/web/src/test/**,packages/ui/src/test/**,packages/runtime/src/node/**,packages/content/src/subjects/**/files/**,**/src/generated/**,packages/dsa/exercises/**,packages/dsa/scripts/traces/solutions.mjs

# Question content is data (strings and fixtures), not application logic: keep it out of
# duplication and coverage metrics. Drill starters are intentionally incomplete.
sonar.cpd.exclusions=packages/content/src/subjects/**
# Mirrors coverage include/exclude in each workspace's vitest.config.ts: Next route files, the build-time bank, the worker
# entry and re-export barrels are not unit-tested; everything else must stay above the vitest thresholds.
# Build scripts run at build time and are verified by the build itself.
sonar.coverage.exclusions=packages/content/src/subjects/**,packages/content/src/bank.ts,packages/content/src/types.ts,apps/web/src/app/**,packages/runtime/src/sandbox.worker.ts,**/index.ts,**/scripts/**

sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info,packages/ui/coverage/lcov.info,packages/content/coverage/lcov.info,packages/runtime/coverage/lcov.info,packages/dsa/coverage/lcov.info
