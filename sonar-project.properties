# SonarCloud (CI-based analysis, .github/workflows/ci.yml). Create the project by importing
# Divalsehgal/front-end-questions in SonarCloud, turn OFF Automatic Analysis
# (Administration → Analysis Method), and add a SONAR_TOKEN repo secret.
# Automatic Analysis ignores this file and reads .sonarcloud.properties instead: keep the two in sync.
sonar.organization=divalsehgal
sonar.projectKey=Divalsehgal_front-end-questions
sonar.projectName=FE Grind

# App code plus the Node build scripts and Vite plugins that ship it.
sonar.sources=src,scripts,vite-plugins
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
# Tests are analysed as tests, not sources. Question fixtures (starters, solutions, test files and
# HTML documents under any subject's files/ folder) are content shown verbatim to learners; some
# deliberately contain the bug a question asks to fix, and src/content/content.test.ts checks them.
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,src/content/subjects/**/files/**

# Question content is data (strings and fixtures), not application logic: keep it out of
# duplication and coverage metrics. Drill starters are intentionally incomplete.
sonar.cpd.exclusions=src/content/subjects/**
# Mirrors coverage.include/exclude in vite.config.ts: app entry points, the build-time bank, the worker
# entry and re-export barrels are not unit-tested; everything else must stay above the vitest thresholds.
# Build scripts and Vite plugins run at build time and are verified by the build itself.
sonar.coverage.exclusions=src/content/subjects/**,src/content/bank.ts,src/content/types.ts,src/main.tsx,src/App.tsx,src/entry-server.tsx,src/preload.ts,src/runtime/sandbox.worker.ts,src/**/index.ts,scripts/**,vite-plugins/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
